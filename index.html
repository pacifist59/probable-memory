<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선곡표 | 국내외 공연 세트리스트 공유 서비스</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'] },
                }
            }
        }
    </script>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        #mobile-menu { transform: translateX(100%); transition: transform 0.3s ease-in-out; }
        #mobile-menu.active { transform: translateX(0); }
        .no-scroll { overflow: hidden; }
        .glass { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .animate-pulse-subtle { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans transition-colors duration-300 overflow-x-hidden">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-24 right-6 z-[300] flex flex-col gap-3 pointer-events-none"></div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 z-[200] hidden overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="fixed inset-0 bg-gray-900/80 backdrop-blur-md" onclick="window.toggleAuthModal(false)"></div>
            <div class="bg-white dark:bg-gray-900 rounded-[2.5rem] p-10 text-center relative z-[210] max-w-md w-full border border-gray-100 dark:border-gray-800">
                <button onclick="window.toggleAuthModal(false)" class="absolute top-6 right-6 text-gray-400 text-2xl transition-colors hover:text-gray-600"><i class="fas fa-times"></i></button>
                <div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-indigo-500/30 rotate-3"><i class="fas fa-microphone-alt text-4xl text-white"></i></div>
                <h3 class="text-3xl font-black mb-10 tracking-tight">로그인하고 기록하기</h3>
                <button onclick="window.handleSocialLogin('google')" class="w-full flex items-center justify-center gap-4 bg-white dark:bg-gray-800 border-2 border-gray-100 dark:border-gray-700 py-5 rounded-2xl font-black text-xl hover:border-indigo-500 transition-all active:scale-95 shadow-xl shadow-gray-100/50 dark:shadow-none">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-8 h-8" alt="Google">
                    Google 계정으로 계속하기
                </button>
            </div>
        </div>
    </div>

    <!-- Add Setlist Modal -->
    <div id="add-modal" class="fixed inset-0 z-[150] hidden overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="fixed inset-0 bg-gray-900/80 backdrop-blur-sm" onclick="window.toggleModal(false)"></div>
            <div class="bg-white dark:bg-gray-900 rounded-[2.5rem] p-8 max-w-2xl w-full relative z-[160] border border-gray-100 dark:border-gray-800">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-3xl font-black tracking-tight">새 선곡표 등록</h3>
                    <button onclick="window.toggleModal(false)" class="text-gray-400 text-2xl hover:text-gray-600"><i class="fas fa-times"></i></button>
                </div>
                <form id="setlist-form" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <input type="text" name="artist" required class="w-full px-5 py-4 rounded-2xl border border-gray-100 dark:border-gray-800 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="아티스트명">
                        <select name="category" required class="w-full px-5 py-4 rounded-2xl border border-gray-100 dark:border-gray-800 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                            <option value="Concert">단독 콘서트</option>
                            <option value="Festival">페스티벌</option>
                            <option value="Fanmeeting">팬미팅</option>
                            <option value="Other">기타</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <input type="date" name="performance_date" required class="w-full px-5 py-4 rounded-2xl border border-gray-100 dark:border-gray-800 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                        <input type="text" name="concert" required class="w-full px-5 py-4 rounded-2xl border border-gray-100 dark:border-gray-800 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="공연명 (투어 명칭)">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <input type="text" name="venue" class="w-full px-5 py-4 rounded-2xl border border-gray-100 dark:border-gray-800 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="공연장">
                        <input type="text" name="location" class="w-full px-5 py-4 rounded-2xl border border-gray-100 dark:border-gray-800 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="지역(도시)">
                    </div>
                    <div>
                        <input type="url" name="ticket_url" class="w-full px-5 py-4 rounded-2xl border border-gray-100 dark:border-gray-800 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="예매 링크 (예: https://ticket.yes24.com/...)">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">공연 포스터 (선택사항)</label>
                        <input type="file" id="image-upload" accept="image/*" class="w-full px-5 py-4 rounded-2xl border border-gray-100 dark:border-gray-800 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                    </div>
                    <div>
                        <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">곡 목록 (한 줄에 한 곡씩)</label>
                        <textarea name="songs_text" rows="6" class="w-full px-5 py-4 rounded-2xl border border-gray-100 dark:border-gray-800 dark:bg-gray-800 outline-none focus:ring-2 focus:ring-indigo-500 transition-all resize-none" placeholder="곡 제목&#10;곡 제목 [비고]&#10;곡 제목 (Cover)&#10;--- 세트 구분선 ---"></textarea>
                    </div>
                    <div class="flex gap-4">
                        <button type="submit" class="flex-1 bg-indigo-600 text-white py-5 rounded-2xl font-black text-xl shadow-xl shadow-indigo-500/20 active:scale-[0.98] transition-all">등록하기</button>
                        <button type="button" id="delete-setlist-btn" class="hidden px-8 bg-red-50 text-red-500 py-5 rounded-2xl font-black text-xl active:scale-[0.98] transition-all"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="bg-white/80 dark:bg-gray-900/80 glass border-b border-gray-100 dark:border-gray-800 sticky top-0 z-[100] h-20 transition-colors">
        <div class="max-w-7xl mx-auto px-4 h-full flex justify-between items-center">
            <div class="flex items-center">
                <a href="#/home" onclick="window.navigateTo('home')" class="text-3xl font-black text-indigo-600 dark:text-indigo-400 tracking-tighter italic mr-8">선곡표</a>
                <div class="hidden xl:flex space-x-6 mr-8">
                    <a href="#/setlists" class="text-gray-500 dark:text-gray-400 font-bold hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">선곡표</a>
                    <a href="#/artists" class="text-gray-500 dark:text-gray-400 font-bold hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">아티스트</a>
                    <a href="#/festivals" class="text-gray-500 dark:text-gray-400 font-bold hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">페스티벌</a>
                    <a href="#/venues" class="text-gray-500 dark:text-gray-400 font-bold hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">공연장</a>
                    <button onclick="window.handleCheckAuthBeforeAdd()" class="text-indigo-600 dark:text-indigo-400 font-black hover:scale-105 transition-transform"><i class="fas fa-plus-circle mr-1"></i> 등록</button>
                </div>
                <!-- Global Search -->
                <div class="hidden md:flex relative group">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-indigo-500 transition-colors"></i>
                    <input type="text" id="global-search" placeholder="아티스트, 공연장 검색..." class="bg-gray-100 dark:bg-gray-800 border-none rounded-2xl pl-11 pr-4 py-2 text-sm font-bold w-64 focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                    <div id="search-results" class="absolute top-full left-0 w-full mt-2 bg-white dark:bg-gray-900 rounded-2xl shadow-2xl border dark:border-gray-800 hidden overflow-hidden z-[110]"></div>
                </div>
            </div>
            <div class="flex items-center gap-2 sm:gap-4">
                <button onclick="window.toggleTheme()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 hover:text-indigo-500 transition-all">
                    <i class="fas fa-sun block dark:hidden"></i>
                    <i class="fas fa-moon hidden dark:block"></i>
                </button>
                <div id="auth-buttons" class="flex items-center gap-4"></div>
                <button onclick="window.toggleMobileMenu(true)" class="xl:hidden text-gray-500 dark:text-gray-400 text-2xl p-2"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu Layer -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[1000] hidden opacity-0 transition-opacity duration-300" onclick="window.toggleMobileMenu(false)"></div>
    <div id="mobile-menu" class="fixed top-0 right-0 h-full w-[85%] max-w-xs bg-white dark:bg-gray-900 z-[1001] shadow-2xl flex flex-col p-8 overflow-y-auto border-l dark:border-gray-800">
        <div class="flex justify-between items-center mb-10">
            <span class="text-2xl font-black text-indigo-600 italic">Menu</span>
            <button onclick="window.toggleMobileMenu(false)" class="text-gray-400 text-3xl"><i class="fas fa-times"></i></button>
        </div>
        <nav class="flex flex-col space-y-2 flex-1">
            <a href="#/setlists" onclick="window.toggleMobileMenu(false)" class="p-4 rounded-2xl text-xl font-black text-gray-700 dark:text-gray-200 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-all">선곡표</a>    
            <a href="#/artists" onclick="window.toggleMobileMenu(false)" class="p-4 rounded-2xl text-xl font-black text-gray-700 dark:text-gray-200 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-all">아티스트</a>  
            <a href="#/festivals" onclick="window.toggleMobileMenu(false)" class="p-4 rounded-2xl text-xl font-black text-gray-700 dark:text-gray-200 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-all">페스티벌</a>  
            <a href="#/venues" onclick="window.toggleMobileMenu(false)" class="p-4 rounded-2xl text-xl font-black text-gray-700 dark:text-gray-200 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-all">공연장</a>        
            <a href="#/stats" onclick="window.toggleMobileMenu(false)" class="p-4 rounded-2xl text-xl font-black text-gray-700 dark:text-gray-200 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-all">통계</a>
            <button onclick="window.handleCheckAuthBeforeAdd()" class="p-4 rounded-2xl text-xl font-black text-indigo-600 dark:text-indigo-400 text-left hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-all"><i class="fas fa-plus-circle mr-2"></i>선곡표 등록</button>
        </nav>
        <div id="mobile-auth-section" class="pt-8 border-t border-gray-100 dark:border-gray-800 space-y-4"></div>
    </div>

    <div id="app-content">
        <header id="home-hero" class="relative bg-indigo-900 text-white py-32 sm:py-48 px-4 overflow-hidden" style="display: none;">
            <div id="hero-background" class="absolute inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1920&q=80')] bg-cover bg-center opacity-40 grayscale-[30%] transition-all duration-1000"></div>
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-indigo-950/50 to-gray-50 dark:to-gray-950"></div>
            <div class="max-w-7xl mx-auto relative z-10">
                <div id="hero-dynamic-content" class="text-center animate-fade-in">
                    <div class="inline-block px-4 py-1.5 bg-white/10 backdrop-blur-md rounded-full text-indigo-200 text-sm font-bold mb-6 border border-white/10 uppercase tracking-widest">Global Concert Archive</div>
                    <h1 class="text-6xl md:text-8xl font-black mb-8 tracking-tighter leading-none">감동의 순간을<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 to-purple-400 italic">선곡표</span>로 남기다</h1>
                    <p class="text-xl md:text-2xl mb-12 text-indigo-100/80 font-medium">전 세계 아티스트의 세트리스트를 한눈에 확인하고 공유하세요.</p>
                    <div class="flex flex-col sm:flex-row justify-center gap-4">
                        <button onclick="window.navigateTo('setlists')" class="bg-white text-indigo-900 px-12 py-5 rounded-[1.5rem] font-black text-xl hover:bg-indigo-50 transition-all shadow-2xl active:scale-95">최근 선곡표</button>
                        <button onclick="window.handleCheckAuthBeforeAdd()" class="bg-indigo-600 text-white px-12 py-5 rounded-[1.5rem] font-black text-xl hover:bg-indigo-700 transition-all shadow-xl active:scale-95">지금 기록하기</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-20 relative z-20 -mt-10 sm:-mt-16">
            <div id="page-router"></div>
        </main>
    </div>

    <footer class="bg-white dark:bg-gray-950 border-t border-gray-100 dark:border-gray-900 py-24 text-center">
        <div class="max-w-7xl mx-auto px-4">
            <span class="text-3xl font-black text-indigo-600 tracking-tighter italic mb-8 inline-block">선곡표</span>
            <p class="text-gray-400 dark:text-gray-500 font-bold text-lg mb-8">음악과 열정을 사랑하는 모든 팬들을 위한 공간.</p>
            <p class="text-gray-300 dark:text-gray-700 font-medium">© 2026 선곡표. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
