<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선곡표 | 국내외 공연 세트리스트 공유 서비스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-black text-indigo-600 tracking-tighter italic">선곡표</a>
                    <div class="hidden md:ml-8 md:flex md:space-x-6">
                        <a href="#" class="text-gray-600 hover:text-indigo-600 font-medium">아티스트</a>
                        <a href="#" class="text-gray-600 hover:text-indigo-600 font-medium">공연장</a>
                        <a href="#" class="text-gray-600 hover:text-indigo-600 font-medium">페스티벌</a>
                    </div>
                </div>
                <div class="flex-1 max-w-md mx-8 hidden sm:block">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-full leading-5 bg-gray-50 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent sm:text-sm" placeholder="아티스트, 공연명 검색...">
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="text-sm font-semibold text-gray-700 hover:text-indigo-600">로그인</button>
                    <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">회원가입</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="relative bg-indigo-900 text-white py-24 px-4 overflow-hidden">
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1920&q=80" alt="Concert Background" class="w-full h-full object-cover opacity-30 grayscale-[20%]">
            <div class="absolute inset-0 bg-gradient-to-b from-indigo-900/60 via-indigo-900/80 to-indigo-900"></div>
        </div>

        <div class="max-w-7xl mx-auto text-center relative z-10">
            <h1 class="text-4xl md:text-6xl font-extrabold mb-6 tracking-tight">어제 그 공연의 감동을<br><span class="text-indigo-300 underline decoration-indigo-500/30">세트리스트</span>로 다시 느껴보세요.</h1>
            <p class="text-lg md:text-xl text-indigo-100 mb-10 max-w-2xl mx-auto">전 세계 아티스트의 공연 세트리스트를 검색하고, 나만의 공연 기록을 공유하세요.</p>
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button class="bg-white text-indigo-900 px-8 py-3 rounded-xl font-bold text-lg hover:bg-indigo-50 transition shadow-lg">최근 세트리스트 보기</button>
                <button class="bg-indigo-600/40 backdrop-blur-md text-white px-8 py-3 rounded-xl font-bold text-lg hover:bg-indigo-600/60 transition border border-white/20">직접 세트리스트 추가</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            
            <!-- Recent Setlists (Left 2/3) -->
            <div class="lg:col-span-2">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-2xl font-bold text-gray-900">최근 공연 세트리스트</h2>
                    <a href="#" class="text-indigo-600 font-semibold hover:underline">모두 보기 <i class="fas fa-chevron-right ml-1 text-xs"></i></a>
                </div>
                
                <div class="space-y-4" id="recent-list">
                    <!-- Dynamic Items will be loaded here via JS -->
                    <div class="animate-pulse flex space-x-4">
                        <div class="flex-1 space-y-4 py-1">
                            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                            <div class="space-y-2">
                                <div class="h-4 bg-gray-200 rounded"></div>
                                <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar (Right 1/3) -->
            <div class="space-y-8">
                <!-- Trending Artists -->
                <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                    <h3 class="text-lg font-bold mb-4">인기 아티스트</h3>
                    <ul class="space-y-4" id="trending-artists">
                        <li class="flex items-center justify-between">
                            <span class="font-medium">아이유 (IU)</span>
                            <span class="text-xs text-gray-500">12 세트리스트</span>
                        </li>
                        <li class="flex items-center justify-between">
                            <span class="font-medium">데이식스 (DAY6)</span>
                            <span class="text-xs text-gray-500">8 세트리스트</span>
                        </li>
                    </ul>
                </div>

                <!-- Banner/Call to action -->
                <div class="bg-gradient-to-br from-indigo-600 to-purple-700 p-6 rounded-2xl text-white">
                    <h3 class="font-bold text-lg mb-2">공연을 관람하셨나요?</h3>
                    <p class="text-sm opacity-90 mb-4 text-indigo-100 leading-relaxed">기억하고 있는 곡 목록을 추가하여 다른 팬들과 공유해보세요!</p>
                    <button class="w-full bg-white text-indigo-700 py-2 rounded-lg font-bold hover:bg-indigo-50 transition">지금 작성하기</button>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-gray-100 border-t border-gray-200 py-12 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-sm">© 2026 선곡표. All rights reserved.</p>
            <div class="mt-4 flex justify-center space-x-6 text-gray-400">
                <a href="#" class="hover:text-gray-600">개인정보처리방침</a>
                <a href="#" class="hover:text-gray-600">이용약관</a>
                <a href="#" class="hover:text-gray-600">문의하기</a>
            </div>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
