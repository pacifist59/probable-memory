<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선곡표 | 국내외 공연 세트리스트 공유 서비스</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <script>
        // Check system preference and set dark mode
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        
        // Listen for system changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (e.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans transition-colors duration-300">

    <!-- Navigation -->
    <nav class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-50 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center">
                    <a href="/" class="text-4xl font-black text-indigo-600 dark:text-indigo-400 tracking-tighter italic mr-4">선곡표</a>
                    <div class="hidden md:ml-8 md:flex md:space-x-8">
                        <a href="#" class="text-gray-600 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 font-bold">아티스트</a>
                        <a href="#" class="text-gray-600 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 font-bold">공연장</a>
                        <a href="#" class="text-gray-600 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 font-bold">페스티벌</a>
                    </div>
                </div>
                <div class="flex-1 max-w-md mx-8 hidden sm:block">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-700 rounded-full leading-5 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent sm:text-sm transition-colors" placeholder="아티스트, 공연명 검색...">
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="text-sm font-bold text-gray-700 dark:text-gray-300 hover:text-indigo-600">로그인</button>
                    <button class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-indigo-700 transition shadow-md shadow-indigo-500/20">회원가입</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="relative bg-indigo-900 text-white py-28 px-4 overflow-hidden">
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1920&q=80" alt="Concert Background" class="w-full h-full object-cover opacity-40 grayscale-[20%]">
            <div class="absolute inset-0 bg-gradient-to-b from-indigo-950/60 via-indigo-950/80 to-gray-50 dark:to-gray-950"></div>
        </div>

        <div class="max-w-7xl mx-auto text-center relative z-10">
            <h1 class="text-5xl md:text-7xl font-black mb-8 tracking-tight">어제 그 공연의 감동을<br><span class="text-indigo-300 underline decoration-indigo-500/30">세트리스트</span>로 다시 느껴보세요.</h1>
            <p class="text-xl md:text-2xl text-indigo-100 mb-12 max-w-3xl mx-auto font-medium opacity-90">전 세계 아티스트의 공연 세트리스트를 검색하고, 나만의 공연 기록을 공유하세요.</p>
            <div class="flex flex-col sm:flex-row justify-center gap-5">
                <button class="bg-white text-indigo-900 px-10 py-4 rounded-2xl font-black text-xl hover:bg-indigo-50 transition shadow-xl hover:scale-105 transform">최근 세트리스트 보기</button>
                <button class="bg-indigo-600/40 backdrop-blur-xl text-white px-10 py-4 rounded-2xl font-black text-xl hover:bg-indigo-600/60 transition border border-white/20 hover:scale-105 transform">직접 세트리스트 추가</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 relative -mt-8 z-20">
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            
            <!-- Recent Setlists (Left 2/3) -->
            <div class="lg:col-span-2">
                <div class="flex items-center justify-between mb-10">
                    <h2 class="text-3xl font-black text-gray-900 dark:text-white">최근 공연 세트리스트</h2>
                    <a href="#" class="text-indigo-600 dark:text-indigo-400 font-bold hover:underline">모두 보기 <i class="fas fa-chevron-right ml-1 text-xs"></i></a>
                </div>
                
                <div class="space-y-6" id="recent-list">
                    <!-- Dynamic Items will be loaded here via JS -->
                </div>
            </div>

            <!-- Sidebar (Right 1/3) -->
            <div class="space-y-8">
                <!-- Trending Artists -->
                <div class="bg-white dark:bg-gray-900 p-8 rounded-3xl border border-gray-100 dark:border-gray-800 shadow-sm transition-colors">
                    <h3 class="text-xl font-black mb-6 dark:text-white">인기 아티스트</h3>
                    <ul class="space-y-5" id="trending-artists">
                        <li class="flex items-center justify-between">
                            <span class="font-bold text-gray-800 dark:text-gray-200 text-lg">아이유 (IU)</span>
                            <span class="text-sm text-gray-500 dark:text-gray-400 font-medium bg-gray-100 dark:bg-gray-800 px-3 py-1 rounded-full">12 세트리스트</span>
                        </li>
                        <li class="flex items-center justify-between">
                            <span class="font-bold text-gray-800 dark:text-gray-200 text-lg">데이식스 (DAY6)</span>
                            <span class="text-sm text-gray-500 dark:text-gray-400 font-medium bg-gray-100 dark:bg-gray-800 px-3 py-1 rounded-full">8 세트리스트</span>
                        </li>
                    </ul>
                </div>

                <!-- Banner/Call to action -->
                <div class="bg-gradient-to-br from-indigo-600 to-purple-700 p-8 rounded-3xl text-white shadow-lg shadow-indigo-500/30">
                    <h3 class="font-black text-2xl mb-3">공연을 관람하셨나요?</h3>
                    <p class="text-indigo-100 mb-6 leading-relaxed font-medium">기억하고 있는 곡 목록을 추가하여 다른 팬들과 공유해보세요!</p>
                    <button class="w-full bg-white text-indigo-700 py-3.5 rounded-2xl font-black text-lg hover:bg-indigo-50 transition shadow-md">지금 작성하기</button>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-gray-100 dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 py-16 mt-12 transition-colors">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 dark:text-gray-400 font-bold">© 2026 선곡표. All rights reserved.</p>

                <a href="#" class="hover:text-gray-600 dark:hover:text-gray-300">이용약관</a>
                <a href="#" class="hover:text-gray-600 dark:hover:text-gray-300">문의하기</a>
            </div>
        </div>
    </footer>
                <a href="#" class="hover:text-gray-600">개인정보처리방침</a>
                <a href="#" class="hover:text-gray-600">이용약관</a>
                <a href="#" class="hover:text-gray-600">문의하기</a>
            </div>
        </div>
