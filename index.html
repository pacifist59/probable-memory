<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선곡표 | 국내외 공연 세트리스트 공유 서비스</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'] },
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Mobile Menu Animation */
        #mobile-menu { transform: translateX(100%); transition: transform 0.3s ease-in-out; }
        #mobile-menu.active { transform: translateX(0); }
        .no-scroll { overflow: hidden; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans transition-colors duration-300 overflow-x-hidden">

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 z-[200] hidden overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="fixed inset-0 bg-gray-900/80 backdrop-blur-md" onclick="window.toggleAuthModal(false)"></div>
            <div class="bg-white dark:bg-gray-900 rounded-[2.5rem] p-10 text-center relative z-[210] max-w-md w-full border border-gray-100 dark:border-gray-800">
                <button onclick="window.toggleAuthModal(false)" class="absolute top-6 right-6 text-gray-400 text-2xl"><i class="fas fa-times"></i></button>
                <div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl"><i class="fas fa-microphone-alt text-4xl text-white"></i></div>
                <h3 class="text-3xl font-black mb-10">로그인하고 시작하기</h3>
                <button onclick="window.handleSocialLogin('google')" class="w-full flex items-center justify-center gap-4 bg-white dark:bg-gray-800 border-2 border-gray-100 dark:border-gray-700 py-5 rounded-2xl font-black text-xl hover:border-indigo-500 transition-all">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-8 h-8" alt="Google">
                    Google로 계속하기
                </button>
            </div>
        </div>
    </div>

    <!-- Add Setlist Modal -->
    <div id="add-modal" class="fixed inset-0 z-[150] hidden overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="fixed inset-0 bg-gray-900/80 backdrop-blur-sm" onclick="window.toggleModal(false)"></div>
            <div class="bg-white dark:bg-gray-900 rounded-[2.5rem] p-8 max-w-2xl w-full relative z-[160] border border-gray-100 dark:border-gray-800">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-3xl font-black">새 선곡표 등록</h3>
                    <button onclick="window.toggleModal(false)" class="text-gray-400 text-2xl"><i class="fas fa-times"></i></button>
                </div>
                <form id="setlist-form" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <input type="text" name="artist" required class="w-full px-5 py-4 rounded-2xl border dark:border-gray-800 dark:bg-gray-800" placeholder="아티스트 명">
                        <input type="date" name="performance_date" required class="w-full px-5 py-4 rounded-2xl border dark:border-gray-800 dark:bg-gray-800">
                    </div>
                    <input type="text" name="concert" required class="w-full px-5 py-4 rounded-2xl border dark:border-gray-800 dark:bg-gray-800" placeholder="공연 명 (투어 이름)">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <input type="text" name="venue" class="w-full px-5 py-4 rounded-2xl border dark:border-gray-800 dark:bg-gray-800" placeholder="공연장">
                        <input type="text" name="location" class="w-full px-5 py-4 rounded-2xl border dark:border-gray-800 dark:bg-gray-800" placeholder="도시/국가">
                    </div>
                    <textarea name="songs_text" rows="6" class="w-full px-5 py-4 rounded-2xl border dark:border-gray-800 dark:bg-gray-800 resize-none" placeholder="곡 목록 (엔터로 구분)"></textarea>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-xl shadow-lg">등록하기</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="bg-white dark:bg-gray-900 border-b border-gray-100 dark:border-gray-800 sticky top-0 z-[100] h-20">
        <div class="max-w-7xl mx-auto px-4 h-full flex justify-between items-center">
            <div class="flex items-center">
                <a href="#/home" onclick="window.navigateTo('home')" class="text-3xl font-black text-indigo-600 tracking-tighter italic mr-8">선곡표</a>
                <div class="hidden xl:flex space-x-6">
                    <a href="#/setlists" class="text-gray-500 font-bold hover:text-indigo-600 transition-colors">선곡표</a>
                    <a href="#/artists" class="text-gray-500 font-bold hover:text-indigo-600 transition-colors">아티스트</a>
                    <a href="#/festivals" class="text-gray-500 font-bold hover:text-indigo-600 transition-colors">페스티벌</a>
                    <a href="#/venues" class="text-gray-500 font-bold hover:text-indigo-600 transition-colors">공연장</a>
                    <a href="#/stats" class="text-gray-500 font-bold hover:text-indigo-600 transition-colors">통계</a>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div id="auth-buttons" class="flex items-center gap-4"></div>
                <button onclick="window.toggleMobileMenu(true)" class="xl:hidden text-gray-500 text-2xl p-2"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu Layer -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[1000] hidden" onclick="window.toggleMobileMenu(false)"></div>
    <div id="mobile-menu" class="fixed top-0 right-0 h-full w-[80%] max-w-xs bg-white dark:bg-gray-900 z-[1001] shadow-2xl flex flex-col p-8 overflow-y-auto">
        <div class="flex justify-between items-center mb-10">
            <span class="text-2xl font-black text-indigo-600 italic">Menu</span>
            <button onclick="window.toggleMobileMenu(false)" class="text-gray-400 text-3xl"><i class="fas fa-times"></i></button>
        </div>
        <nav class="flex flex-col space-y-4 flex-1">
            <a href="#/setlists" onclick="window.toggleMobileMenu(false)" class="p-4 rounded-xl text-xl font-black bg-gray-50 dark:bg-gray-800">선곡표</a>
            <a href="#/artists" onclick="window.toggleMobileMenu(false)" class="p-4 rounded-xl text-xl font-black bg-gray-50 dark:bg-gray-800">아티스트</a>
            <a href="#/festivals" onclick="window.toggleMobileMenu(false)" class="p-4 rounded-xl text-xl font-black bg-gray-50 dark:bg-gray-800">페스티벌</a>
            <a href="#/venues" onclick="window.toggleMobileMenu(false)" class="p-4 rounded-xl text-xl font-black bg-gray-50 dark:bg-gray-800">공연장</a>
            <a href="#/stats" onclick="window.toggleMobileMenu(false)" class="p-4 rounded-xl text-xl font-black bg-gray-50 dark:bg-gray-800">통계</a>
        </nav>
        <div id="mobile-auth-section" class="pt-8 border-t dark:border-gray-800 space-y-4"></div>
    </div>

    <div id="app-content">
        <header id="home-hero" class="relative bg-indigo-900 text-white py-32 px-4">
            <div class="absolute inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1920&q=80')] bg-cover bg-center opacity-40"></div>
            <div class="max-w-7xl mx-auto text-center relative z-10">
                <h1 class="text-5xl md:text-7xl font-black mb-6 tracking-tighter">전율의 순간을 기록하다</h1>
                <p class="text-xl mb-10 text-indigo-100">국내외 아티스트의 세트리스트를 한눈에 확인하세요.</p>
                <div class="flex justify-center gap-4">
                    <button onclick="window.navigateTo('setlists')" class="bg-white text-indigo-900 px-10 py-4 rounded-2xl font-black text-lg">최근 선곡표</button>
                    <button onclick="window.handleCheckAuthBeforeAdd()" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-black text-lg">기록하기</button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-20">
            <div id="page-router"></div>
        </main>
    </div>

    <footer class="bg-white dark:bg-gray-900 border-t dark:border-gray-800 py-16 text-center">
        <p class="text-gray-400 font-bold">© 2026 선곡표. All Rights Reserved.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
